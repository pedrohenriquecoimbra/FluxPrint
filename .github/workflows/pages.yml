name: Publish web tool

# Reads the ICOS zarr stores, builds the web tool into _site and serves it with
# GitHub Pages. One-time setup: Settings > Pages > Source: GitHub Actions.
#
# The daily run follows ICOS, which rebuilds the near-real-time store at about
# 04:00 UTC. If it ever stops, the page keeps working and shows the dates it was
# last built with. GitHub pauses schedules after 60 days without repository activity.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/build_site.py"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install xarray zarr fsspec aiohttp pandas requests
      - run: python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
